<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f3c"/>
      <stop offset="0.48" stop-color="#0e5a70"/>
      <stop offset="1" stop-color="#2b2a63"/>
    </linearGradient>
    <radialGradient id="brillo">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brillo2">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ventana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5f3fc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Fondo y luces ambientales -->
  <rect width="1600" height="900" fill="url(#cielo)"/>
  <circle cx="1280" cy="130" r="460" fill="url(#brillo)"/>
  <circle cx="240" cy="820" r="420" fill="url(#brillo2)"/>

  <!-- Skyline al fondo -->
  <g fill="#7dd3fc" opacity="0.16">
    <rect x="40" y="340" width="110" height="300"/>
    <rect x="165" y="270" width="90" height="370"/>
    <rect x="270" y="390" width="130" height="250"/>
    <rect x="420" y="310" width="80" height="330"/>
    <rect x="1140" y="360" width="120" height="280"/>
    <rect x="1280" y="290" width="95" height="350"/>
    <rect x="1390" y="380" width="150" height="260"/>
  </g>
  <g fill="#a5f3fc" opacity="0.22">
    <rect x="185" y="300" width="12" height="18"/><rect x="215" y="300" width="12" height="18"/>
    <rect x="185" y="345" width="12" height="18"/><rect x="215" y="345" width="12" height="18"/>
    <rect x="440" y="340" width="12" height="18"/><rect x="468" y="340" width="12" height="18"/>
    <rect x="1300" y="325" width="12" height="18"/><rect x="1332" y="325" width="12" height="18"/>
    <rect x="1300" y="370" width="12" height="18"/><rect x="1332" y="370" width="12" height="18"/>
    <rect x="1425" y="415" width="12" height="18"/><rect x="1460" y="415" width="12" height="18"/>
  </g>

  <!-- Gran ventana de la oficina -->
  <g opacity="0.5">
    <rect x="60" y="70" width="1480" height="640" fill="url(#ventana)"/>
    <g stroke="#67e8f9" stroke-opacity="0.28" stroke-width="3">
      <path d="M60 70H1540 M60 710H1540 M60 70V710 M430 70V710 M800 70V710 M1170 70V710 M1540 70V710"/>
      <path d="M60 390H1540"/>
    </g>
  </g>

  <!-- Mesa de trabajo -->
  <path d="M120 770 H1480" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="5"/>
  <rect x="120" y="772" width="1360" height="16" rx="8" fill="#0e7490" opacity="0.28"/>

  <!-- Pantallas con gráficos -->
  <g opacity="0.5">
    <rect x="150" y="560" width="190" height="125" rx="10" fill="#083344" stroke="#22d3ee" stroke-opacity="0.45"/>
    <path d="M170 655 L205 625 L240 638 L275 600 L315 610" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1260" y="545" width="190" height="140" rx="10" fill="#083344" stroke="#a78bfa" stroke-opacity="0.5"/>
    <path d="M1280 660 v-22 h26 v-30 h26 v-28 h26 v42 h26 v38" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Personas en reunión -->
  <g fill="#062433" opacity="0.72">
    <circle cx="470" cy="520" r="44"/>
    <rect x="410" y="575" width="120" height="130" rx="52"/>
    <circle cx="800" cy="480" r="50"/>
    <rect x="732" y="540" width="136" height="165" rx="58"/>
    <circle cx="1120" cy="525" r="42"/>
    <rect x="1064" y="578" width="112" height="128" rx="50"/>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-opacity="0.35" stroke-width="3">
    <circle cx="470" cy="520" r="58"/>
    <circle cx="800" cy="480" r="65"/>
    <circle cx="1120" cy="525" r="56"/>
  </g>

  <!-- Conexiones entre perfiles -->
  <g fill="none" stroke="#a5f3fc" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="7 11">
    <path d="M470 520 Q640 405 800 480"/>
    <path d="M800 480 Q960 405 1120 525"/>
    <path d="M470 520 Q780 700 1120 525"/>
  </g>
  <g fill="#e0f2fe" opacity="0.85">
    <circle cx="470" cy="520" r="6"/><circle cx="800" cy="480" r="7"/><circle cx="1120" cy="525" r="6"/>
  </g>

  <!-- Planta y detalles -->
  <g fill="#34d399" opacity="0.28">
    <ellipse cx="1420" cy="700" rx="26" ry="72" transform="rotate(-25 1420 700)"/>
    <ellipse cx="1470" cy="690" rx="24" ry="66" transform="rotate(28 1470 690)"/>
    <ellipse cx="1445" cy="650" rx="22" ry="62"/>
  </g>
  <path d="M1395 770 h100 l-14 60 h-72 z" fill="#0e7490" opacity="0.3"/>

  <!-- Partículas de luz -->
  <g fill="#e0f2fe" opacity="0.14">
    <circle cx="120" cy="180" r="5"/><circle cx="330" cy="120" r="3"/><circle cx="620" cy="210" r="4"/>
    <circle cx="990" cy="150" r="3"/><circle cx="1180" cy="260" r="5"/><circle cx="1490" cy="190" r="4"/>
    <circle cx="250" cy="470" r="3"/><circle cx="960" cy="430" r="4"/><circle cx="1350" cy="470" r="3"/>
  </g>
</svg>
