<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Consultora de Convocatorias: registro y selección de talento con criterios claros." />
    <title>Consultora de Convocatorias · Registro y selección de postulantes</title>
    <script>
      try {
        const tema = localStorage.getItem('tema') === 'light' ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', tema === 'dark');
        document.documentElement.dataset.theme = tema;
      } catch (_) { /* tema por defecto */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
